version: "3.9"

# Local development convenience (NOT used by the platform container).
# Run: docker compose up -d
# Postgres + Redis only. The app itself runs outside compose during dev.
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: posuhtik
      POSTGRES_PASSWORD: posuhtik_dev
      POSTGRES_DB: posuhtik_dev
    ports: ["5432:5432"]
    volumes:
      - posuhtik_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posuhtik"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    # Phase 1 note: Redis is reserved for future queue migration (Celery/RQ).
    # APScheduler runs in-process; Redis is NOT required for Phase 1 to function.

volumes:
  posuhtik_pg:
